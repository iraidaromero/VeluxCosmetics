<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Velux Cosmetics</title>
  <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
  <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">

  <div class="card shadow p-4" style="max-width: 400px; width: 100%;">
    <h2 class="text-center mb-4">Velux Cosmetics</h2>

    <!-- Pestañas -->
    <ul class="nav nav-tabs mb-4" id="myTab" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button">
          Iniciar Sesión
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="registro-tab" data-bs-toggle="tab" data-bs-target="#registro" type="button">
          Registrarse
        </button>
      </li>
    </ul>

    <div class="tab-content" id="myTabContent">

      <!-- LOGIN -->
      <div class="tab-pane fade show active" id="login">
        <input class="form-control mb-2" type="email" placeholder="Correo">
        <input class="form-control mb-3" type="password" placeholder="Contraseña">

        <button class="btn btn-dark w-100" data-bs-toggle="modal" data-bs-target="#modalLogin">
          Entrar
        </button>
      </div>

      <!-- REGISTRO -->
      <div class="tab-pane fade" id="registro">
        <input class="form-control mb-2" type="text" placeholder="Nombre">
        <input class="form-control mb-2" type="email" placeholder="Correo">
        <input class="form-control mb-3" type="password" placeholder="Contraseña">

        <button class="btn btn-success w-100" data-bs-toggle="modal" data-bs-target="#modalRegistro">
          Crear cuenta
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL LOGIN -->
  <div class="modal fade" id="modalLogin" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-dark text-white">
          <h5 class="modal-title">Inicio de sesión correcto</h5>
        </div>
        <div class="modal-body">
          ¡Bienvenida de nuevo a Velux Cosmetics! 🌸
        </div>
        <div class="modal-footer">
          <a href="index.html" class="btn btn-dark">Ir a inicio</a>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL REGISTRO -->
  <div class="modal fade" id="modalRegistro" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title">Cuenta creada</h5>
        </div>
        <div class="modal-body">
          ¡Tu cuenta se ha creado correctamente! 💚
        </div>
        <div class="modal-footer">
          <a href="index.html" class="btn btn-success">Ir a inicio</a>
        </div>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
