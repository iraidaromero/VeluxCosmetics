<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Velux Cosmetics</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/colores.css">
</head>

<body>

  <div class="contenedor-login">
    <img src="img/logo/logo.png" alt="Velux Cosmetics" class="logo">

    <!-- Pestañas -->
    <ul class="nav nav-tabs navegacion-login" id="pestanasLogin" role="tablist">
      <li class="nav-item">
        <button class="nav-link active" id="iniciar-tab" data-bs-toggle="tab" data-bs-target="#iniciar" type="button">Iniciar sesión</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="registrar-tab" data-bs-toggle="tab" data-bs-target="#registrar" type="button">Registrarse</button>
      </li>
    </ul>

    <div class="tab-content">
      <!-- Iniciar Sesión -->
      <div class="tab-pane fade show active" id="iniciar" role="tabpanel">
        <form class="formulario-login">
          <div class="mb-3">
            <label for="correo-login" class="form-label">Correo electrónico</label>
            <input type="email" class="form-control campo" id="correo-login" required>
          </div>

          <div class="mb-3">
            <label for="clave-login" class="form-label">Contraseña</label>
            <input type="password" class="form-control campo" id="clave-login" required>
          </div>

          <button type="submit" class="btn btn-principal w-100">Iniciar sesión</button>
        </form>

        <div class="enlace-secundario">
          <a href="#">¿Has olvidado tu contraseña?</a>
        </div>
      </div>

      <!-- Registro -->
      <div class="tab-pane fade" id="registrar" role="tabpanel">
        <form class="formulario-login">
          <div class="mb-3">
            <label for="nombre-registro" class="form-label">Nombre completo</label>
            <input type="text" class="form-control campo" id="nombre-registro" required>
          </div>

          <div class="mb-3">
            <label for="correo-registro" class="form-label">Correo electrónico</label>
            <input type="email" class="form-control campo" id="correo-registro" required>
          </div>

          <div class="mb-3">
            <label for="clave-registro" class="form-label">Contraseña</label>
            <input type="password" class="form-control campo" id="clave-registro" required>
          </div>

          <div class="mb-3">
            <label for="confirmar-clave" class="form-label">Confirmar contraseña</label>
            <input type="password" class="form-control campo" id="confirmar-clave" required>
          </div>

          <button type="submit" class="btn btn-principal w-100">Crear cuenta</button>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
