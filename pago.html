<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página de Pago | Velux Cosmetics</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="icon" type="image/x-icon" href="img/logo/favicon1.ico">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="contenedor-pago">
    <img src="img/logo/logo.png" alt="Velux Cosmetics" class="logo">

    <h2>Confirmación de Pago</h2>
    <p>Ya casi has terminado. Revisa tu pedido y completa el pago de forma segura.</p>

    <!-- Productos -->
    <ul class="list-group mb-3">
      <li class="list-group-item">
        <img src="img/productos/facial/SerumVitaminaC.png" alt="Sérum Vitamina C" class="producto-img">
        <span>Sérum Vitamina C 30ml</span>
        <strong>35,95 €</strong>
      </li>
      <li class="list-group-item">
        <img src="img/productos/corporal/CremaCorporal.png" alt="Crema Hidratante" class="producto-img">
        <span>Crema Hidratante 50ml</span>
        <strong>22,95 €</strong>
      </li>
      <li class="list-group-item total">
        <span>Total</span>
        <strong>58,90 €</strong>
      </li>
    </ul>

    <!-- Cupón promocional -->
    <div class="cupon">
      <input type="text" placeholder="Código promocional" class="form-control">
      <button class="btn btn-secondary">Aplicar cupón</button>
    </div>

    <!-- Métodos de pago -->
    <div class="metodos-pago">
      <p>Métodos de pago:</p>
      <div class="logos-pago">
        <img src="img/nav/pagos.png" alt="Visa">
      </div>
    </div>

    <button class="btn btn-primary btn-pagar">Tramitar pedido</button>

    <div class="footer">
      &copy; 2025 Velux Cosmetics
    </div>
  </div>

</body>
</html>
