<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página de Pago | Velux Cosmetics</title>
  
  <link rel="stylesheet" href="css/main.css"> <link rel="icon" type="image/x-icon" href="img/logo/favicon1.ico">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<body class="bg-light">

  <div class="container my-5">
    <main>
      <div class="py-5 text-center">
        <img class="d-block mx-auto mb-4" src="img/logo/logo.png" alt="" width="150">
        <h2>Confirmación de Pago</h2>
        <p class="lead">Ya casi has terminado. Revisa tu pedido y completa los datos de pago.</p>
      </div>

      <div class="row g-5">
        
        <div class="col-md-5 col-lg-4 order-md-last">
          <h4 class="d-flex justify-content-between align-items-center mb-3">
            <span class="text-primary">Tu carrito</span>
            <span class="badge bg-primary rounded-pill">2</span>
          </h4>
          <ul class="list-group mb-3">
            <li class="list-group-item d-flex justify-content-between lh-sm">
              <div>
                <h6 class="my-0">Sérum Vitamina C</h6>
                <small class="text-muted">30ml</small>
              </div>
              <span class="text-muted">35,95 €</span>
            </li>
            <li class="list-group-item d-flex justify-content-between lh-sm">
              <div>
                <h6 class="my-0">Crema Hidratante corporal</h6>
                <small class="text-muted">50ml</small>
              </div>
              <span class="text-muted">22,95 €</span>
            </li>
            
            <li class="list-group-item d-flex justify-content-between">
              <span>Total (EUR)</span>
              <strong>58,90 €</strong>
            </li>
          </ul>

          <form class="card p-2">
            <div class="input-group">
              <input type="text" class="form-control" placeholder="Código promocional">
              <button type="submit" class="btn btn-secondary">Canjear</button>
            </div>
          </form>
        </div>

        <div class="col-md-7 col-lg-8">
          <h4 class="mb-3">Dirección de Envío</h4>
          <form class="needs-validation" novalidate>
            <div class="row g-3">
              <div class="col-sm-6">
                <label for="firstName" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="firstName" placeholder="" value="" required>
              </div>

              <div class="col-sm-6">
                <label for="lastName" class="form-label">Apellidos</label>
                <input type="text" class="form-control" id="lastName" placeholder="" value="" required>
              </div>

              <div class="col-12">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="tu@email.com">
              </div>

              <div class="col-12">
                <label for="address" class="form-label">Dirección</label>
                <input type="text" class="form-control" id="address" placeholder="Calle Falsa, 123" required>
              </div>

              <div class="col-md-5">
                <label for="country" class="form-label">País</label>
                <select class="form-select" id="country" required>
                  <option value="">Elegir...</option>
                  <option>España</option>
                </select>
              </div>

              <div class="col-md-4">
                <label for="state" class="form-label">Provincia</label>
                <select class="form-select" id="state" required>
                  <option value="">Elegir...</option>
                  <option>Madrid</option>
                  <option>Barcelona</option>
                  <option>Valencia</option>
                </select>
              </div>

              <div class="col-md-3">
                <label for="zip" class="form-label">Cód. Postal</label>
                <input type="text" class="form-control" id="zip" placeholder="" required>
              </div>
            </div>

            <hr class="my-4">

            <h4 class="mb-3">Método de Pago</h4>

            <div class="my-3">
              <div class="form-check">
                <input id="credit" name="paymentMethod" type="radio" class="form-check-input" checked required>
                <label class="form-check-label" for="credit">Tarjeta de crédito</label>
              </div>
              <div class="form-check">
                <input id="debit" name="paymentMethod" type="radio" class="form-check-input" required>
                <label class="form-check-label" for="debit">Tarjeta de débito</label>
              </div>
              <div class="form-check">
                <input id="paypal" name="paymentMethod" type="radio" class="form-check-input" required>
                <label class="form-check-label" for="paypal">PayPal</label>
              </div>
            </div>

            <div class="row gy-3">
              <div class="col-md-6">
                <label for="cc-name" class="form-label">Nombre en la tarjeta</label>
                <input type="text" class="form-control" id="cc-name" placeholder="" required>
              </div>

              <div class="col-md-6">
                <label for="cc-number" class="form-label">Número de tarjeta</label>
                <input type="text" class="form-control" id="cc-number" placeholder="" required>
              </div>

              <div class="col-md-3">
                <label for="cc-expiration" class="form-label">Expiración</label>
                <input type="text" class="form-control" id="cc-expiration" placeholder="MM/AA" required>
              </div>

              <div class="col-md-3">
                <label for="cc-cvv" class="form-label">CVV</label>
                <input type="text" class="form-control" id="cc-cvv" placeholder="" required>
              </div>
            </div>

            <hr class="my-4">
            
            <button class="w-100 btn btn-secondary btn-lg" type="submit">Pagar 58,90 €</button>
          </form>
        </div>
      </div>
    </main>
  </div>
  
  <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
